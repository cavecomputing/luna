appId: io.cavecomputing.luna
productName: Luna
copyright: Copyright © 2026 Matt Haney

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json

# The tray icon is read from disk at runtime, so it must ship outside the asar.
# Paths here mirror src/main/paths.ts — change one, change the other.
extraResources:
  - from: assets/LunaMenuBarIcon
    to: assets/LunaMenuBarIcon
    filter:
      - LunaTemplate.png
      - LunaTemplate@2x.png

asar: true

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization credentials come from the environment:
  #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
  notarize: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
